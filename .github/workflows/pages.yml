name: Website controleren en publiceren

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
      timezone: Europe/Amsterdam
  workflow_dispatch:
    inputs:
      refresh_reviews:
        description: Google-reviews nu controleren
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviews:
    name: Wekelijkse Google-reviews
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.refresh_reviews) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[reviews-check]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          check-latest: true
      - name: Openbare reviews ophalen en bestaande kaarten bijwerken
        run: node scripts/sync-google-reviews.mjs
      - run: npm --prefix tests ci --ignore-scripts --no-audit
      - run: node scripts/check-secrets.mjs
      - run: npm --prefix tests audit --audit-level=moderate --ignore-scripts
      - run: npm --prefix tests test
      - run: node scripts/prepare-pages.mjs
      - name: Alleen gecontroleerde reviewwijzigingen bewaren
        id: save
        shell: bash
        run: |
          git add -- homepage.html data/google-reviews.snapshot.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Werk Google-reviewkaarten bij na wekelijkse controle'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: Beveiliging en tests
    needs: reviews
    if: always() && (needs.reviews.result == 'success' || needs.reviews.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.reviews.outputs.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          check-latest: true
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - if: needs.reviews.result != 'success'
        run: npm --prefix tests ci --ignore-scripts --no-audit
      - if: needs.reviews.result != 'success'
        run: node scripts/check-secrets.mjs
      - if: needs.reviews.result != 'success'
        run: npm --prefix tests audit --audit-level=moderate --ignore-scripts
      - if: needs.reviews.result != 'success'
        run: npm --prefix tests test
      - run: node scripts/prepare-pages.mjs
      - name: Alleen de publieke website verpakken
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/pages

  deploy:
    if: always() && needs.check.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publiceer gecontroleerde bestanden
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
